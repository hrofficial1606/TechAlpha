server:
  port: 8080
  tomcat:
    threads:
      max: ${SERVER_THREADS_MAX:400}
      min-spare: ${SERVER_THREADS_MIN:50}
    accept-count: ${SERVER_ACCEPT_COUNT:1000}
    max-connections: ${SERVER_MAX_CONNECTIONS:20000}

spring:
  application:
    name: techalfa-auth-backend
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:techalfa}
    password: ${DB_PASSWORD:techalfa123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: false
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvbmctYmFzZTY0LWVuY29kZWQtc2VjcmV0LWtleS1mb3ItdGVjaGFsZmEtYXV0aA==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  otp:
    length: 6
    expiration-minutes: 10
  mail:
    from-address: ${MAIL_FROM:your-email@gmail.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

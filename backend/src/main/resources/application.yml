server:
  port: 8080
  tomcat:
    threads:
      max: ${SERVER_THREADS_MAX:400}
      min-spare: ${SERVER_THREADS_MIN:50}
    accept-count: ${SERVER_ACCEPT_COUNT:1000}
    max-connections: ${SERVER_MAX_CONNECTIONS:20000}

spring:
  application:
    name: techalfa-auth-backend
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  otp:
    length: 6
    expiration-minutes: 10
  mail:
    from-address: ${MAIL_FROM:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  paypal:
    enabled: ${PAYPAL_ENABLED:false}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    return-url: ${PAYPAL_RETURN_URL:https://techalfa.org/payment/success}
    cancel-url: ${PAYPAL_CANCEL_URL:https://techalfa.org/payment/cancel}
  admin:
    email: ${ADMIN_EMAIL:widesoftech@gmail.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:TechAlpha Admin}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    default-folder: ${CLOUDINARY_DEFAULT_FOLDER:techalfa}
